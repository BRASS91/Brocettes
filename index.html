<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7A1F12">
<title>Brocettes Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral+SC:wght@600;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link rel="stylesheet" href="app.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="48x48" href="assets/icons/icon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Brocettes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
<div class="top-actions">
  <button type="button" class="feedback-fab" aria-label="Suggest something for the app" aria-haspopup="dialog" aria-controls="feedback-sheet"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8.5 9.5h7M8.5 12.5h4"/></svg></button>
  <button type="button" class="search-fab" aria-label="Search the campaign" aria-haspopup="dialog" aria-controls="search-sheet"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
</div>
<div id="search-sheet" class="search-sheet" role="dialog" aria-modal="true" aria-label="Search the campaign" hidden>
  <div class="search-backdrop" data-close-search></div>
  <div class="search-panel">
    <div class="row">
      <label class="search"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span class="sr">Search the campaign</span>
        <input id="q" type="search" autocomplete="off" enterkeyhint="search" placeholder="Name, place, item, anything…"></label>
      <button type="button" class="search-close" data-close-search>Cancel</button>
    </div>
    <div id="results" class="stack search-results"></div>
  </div>
</div>
<main id="app" aria-live="polite"><p class="loading">Opening the tome…</p></main>
<nav class="tabs" aria-label="Main">
  <a href="#/" data-tab="home"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg>Home</a>
  <a href="#/quests" data-tab="quests"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 21V4h12l-2 4 2 4H5"/></svg>Quests</a>
  <a href="#/codex" data-tab="codex"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 4h6a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H4zM20 4h-6a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h6z"/></svg>Codex</a>
  <a href="#/party" data-tab="party"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/></svg>Party</a>
</nav>
<script src="app.js"></script>
<script src="features/panzoom.js"></script>
<script src="features/web.js"></script>
<script src="features/map.js"></script>
<script src="features/table.js"></script>
<script src="features/notify.js"></script>
<script src="features/theories.js"></script>
<script src="features/feedback.js"></script>
</body>
</html>
